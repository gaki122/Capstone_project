<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teacher Registration | Data Quest</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef4ff,
                    #f8fbff
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            background: white;

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 15px 40px rgba(
                    0,
                    0,
                    0,
                    0.10
                );
        }

        .logo {
            text-align: center;

            font-size: 42px;

            margin-bottom: 5px;
        }

        h1 {
            text-align: center;

            margin: 0;

            color: #1e3a8a;

            font-size: 28px;
        }

        .subtitle {
            text-align: center;

            color: #64748b;

            margin-top: 8px;

            margin-bottom: 28px;

            font-size: 15px;
        }

        .teacher-badge {
            display: block;

            width: fit-content;

            margin: 0 auto 25px;

            padding: 7px 14px;

            border-radius: 20px;

            background: #dbeafe;

            color: #1d4ed8;

            font-size: 13px;

            font-weight: bold;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-size: 14px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(
                    37,
                    99,
                    235,
                    0.10
                );
        }

        .error {
            background: #fee2e2;

            color: #b91c1c;

            border: 1px solid #fecaca;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 14px;

            text-align: center;
        }

        .button {
            width: 100%;

            border: none;

            border-radius: 10px;

            padding: 14px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .button:hover {
            background: #1d4ed8;

            transform: translateY(-1px);
        }

        .links {
            text-align: center;

            margin-top: 22px;

            font-size: 14px;

            color: #64748b;
        }

        .links a {
            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .home-link {
            display: block;

            text-align: center;

            margin-top: 15px;

            color: #64748b;

            text-decoration: none;

            font-size: 14px;
        }

        .home-link:hover {
            color: #2563eb;
        }

        .required {
            color: #dc2626;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="card">

        <div class="logo">
            👨‍🏫
        </div>

        <h1>
            Teacher Registration
        </h1>

        <p class="subtitle">
            Create your Data Quest teacher account
        </p>

        <span class="teacher-badge">
            TEACHER ACCOUNT
        </span>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <!-- Full Name -->

            <div class="form-group">

                <label for="full_name">
                    Full Name
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- Username -->

            <div class="form-group">

                <label for="username">
                    Username
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                    <span class="required">*</span>
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                    <span class="required">*</span>
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Enter your password again"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="button"
            >
                👨‍🏫 Create Teacher Account
            </button>

        </form>


        <div class="links">

            Already have a teacher account?

            <a href="{% url 'teacher_login' %}">
                Teacher Login
            </a>

        </div>


        <a
            href="{% url 'home' %}"
            class="home-link"
        >
            ← Back to Data Quest
        </a>

    </div>

</div>

</body>

</html>
