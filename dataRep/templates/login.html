<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Login | Data Quest</title>


    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            min-height: 100vh;
        }


        /* =========================
           NAVIGATION
        ========================= */

        nav {
            background: rgba(255, 255, 255, 0.97);
            border-bottom: 1px solid #e2e8f0;

            padding: 15px 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 25px;

            position: sticky;
            top: 0;
            z-index: 1000;

            backdrop-filter: blur(10px);
        }


        .nav-container {
            width: 100%;
            max-width: 1180px;

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 25px;
        }


        .logo {
            font-size: 26px;
            font-weight: 900;

            color: #111827;

            text-decoration: none;

            padding: 8px 12px;

            border-radius: 8px;

            white-space: nowrap;

            transition: 0.25s;
        }


        .logo:hover {
            color: #2563eb;
            background: #eff6ff;
        }


        .nav-links {
            display: flex;
            align-items: center;

            gap: 4px;

            flex-wrap: wrap;
        }


        .nav-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            color: #111827;

            background: transparent;

            text-decoration: none;

            font-size: 15px;
            font-weight: 800;

            padding: 9px 13px;

            border-radius: 8px;

            border: 1px solid transparent;

            white-space: nowrap;

            transition: 0.25s;
        }


        .nav-links a:hover {
            color: #2563eb;

            background: #eff6ff;

            border-color: #dbeafe;
        }


        .nav-links a.active {
            color: #2563eb;

            background: #eff6ff;

            border-color: #dbeafe;
        }


        /* =========================
           LOGIN SECTION
        ========================= */

        .login-section {
            min-height: calc(100vh - 76px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 60px 20px;
        }


        .login-container {
            width: 100%;
            max-width: 470px;
        }


        /* =========================
           LOGIN CARD
        ========================= */

        .login-card {
            background: #ffffff;

            padding: 40px;

            border-radius: 18px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.08);
        }


        .login-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            border-radius: 18px;

            background: #eff6ff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 34px;
        }


        .login-card h1 {
            text-align: center;

            font-size: 32px;
            line-height: 1.3;

            color: #111827;

            margin-bottom: 10px;
        }


        .login-card h1 span {
            color: #2563eb;
        }


        .subtitle {
            text-align: center;

            color: #6b7280;

            font-size: 16px;
            line-height: 1.6;

            margin-bottom: 30px;
        }


        /* =========================
           ERROR MESSAGE
        ========================= */

        .error {
            background: #fee2e2;
            color: #b91c1c;

            border: 1px solid #fecaca;

            padding: 12px 14px;

            border-radius: 9px;

            margin-bottom: 22px;

            text-align: center;

            font-size: 14px;
            line-height: 1.5;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }


        label {
            display: block;

            margin-bottom: 8px;

            color: #374151;

            font-size: 15px;
            font-weight: 600;
        }


        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            background: #ffffff;

            color: #111827;

            font-size: 15px;

            transition: 0.25s;
        }


        input::placeholder {
            color: #9ca3af;
        }


        input:focus {
            outline: none;

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10);
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-button {
            width: 100%;

            padding: 14px 20px;

            border: none;

            border-radius: 9px;

            background: #2563eb;
            color: #ffffff;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }


        .login-button:hover {
            background: #1d4ed8;

            transform: translateY(-1px);
        }


        /* =========================
           REGISTER
        ========================= */

        .register-link {
            text-align: center;

            margin-top: 24px;

            color: #6b7280;

            font-size: 14px;
            line-height: 1.6;
        }


        .register-link a {
            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }


        .register-link a:hover {
            text-decoration: underline;
        }


        /* =========================
           BACK TO HOME
        ========================= */

        .home-link {
            display: block;

            text-align: center;

            margin-top: 20px;

            padding: 12px 16px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            text-decoration: none;

            color: #374151;

            font-size: 14px;
            font-weight: 600;

            transition: 0.25s;
        }


        .home-link:hover {
            background: #f8fafc;

            color: #2563eb;

            border-color: #bfdbfe;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #111827;

            color: #9ca3af;

            text-align: center;

            padding: 22px 20px;

            font-size: 14px;
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 850px) {

            nav {
                padding: 15px 20px;
            }


            .nav-container {
                flex-direction: column;

                gap: 12px;
            }


            .nav-links {
                justify-content: center;
            }


            .login-section {
                min-height: auto;

                padding: 50px 20px;
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            nav {
                padding: 12px 15px;
            }


            .logo {
                font-size: 23px;
            }


            .nav-links {
                gap: 4px;
            }


            .nav-links a {
                font-size: 13px;

                padding: 8px 9px;
            }


            .login-section {
                padding: 35px 15px;
            }


            .login-card {
                padding: 30px 22px;

                border-radius: 15px;
            }


            .login-card h1 {
                font-size: 27px;
            }


            .subtitle {
                font-size: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav>

        <div class="nav-container">


            <a
                href="{% url 'home' %}"
                class="logo"
            >
                Data Quest
            </a>


            <div class="nav-links">


                <a
                    href="{% url 'home' %}"
                    class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}"
                >
                    Home
                </a>


                <a
                    href="{% url 'learn' %}"
                    class="{% if request.resolver_match.url_name == 'learn' %}active{% endif %}"
                >
                    Learn
                </a>


                <a
                    href="{% url 'how_to_play' %}"
                    class="{% if request.resolver_match.url_name == 'how_to_play' %}active{% endif %}"
                >
                    How to Play
                </a>


                <a
                    href="{% url 'student_login' %}"
                    class="{% if request.resolver_match.url_name == 'student_login' %}active{% endif %}"
                >
                    Student Login
                </a>


                <a
                    href="{% url 'teacher_login' %}"
                    class="{% if request.resolver_match.url_name == 'teacher_login' %}active{% endif %}"
                >
                    Teacher Login
                </a>


            </div>

        </div>

    </nav>


    <!-- =========================
         LOGIN SECTION
    ========================= -->

    <main class="login-section">


        <div class="login-container">


            <div class="login-card">


                <div class="login-icon">
                    🎓
                </div>


                <h1>
                    Student <span>Login</span>
                </h1>


                <p class="subtitle">
                    Sign in to continue your Data Quest journey.
                </p>


                {% if error %}

                    <div class="error">
                        {{ error }}
                    </div>

                {% endif %}


                <form method="POST">

                    {% csrf_token %}


                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>


                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="login-button"
                    >
                        Login 🚀
                    </button>


                </form>


                <div class="register-link">

                    Don't have an account?

                    <a href="{% url 'register' %}">
                        Create an account
                    </a>

                </div>


                <a
                    href="{% url 'home' %}"
                    class="home-link"
                >
                    ← Back to Home
                </a>


            </div>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        © 2026 Data Quest.
        Learn. Play. Master Data Representation.

    </footer>


</body>

</html>
