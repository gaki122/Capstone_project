<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Level 1 - ASCII | Data Quest</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
        }

        .navbar {
            background: #2563eb;
            color: white;
            padding: 18px 40px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            color: #2563eb;
        }

        .icon {
            font-size: 60px;
        }

        .start-button {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 30px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .start-button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">
        🎯 Data Quest
    </div>
</nav>

<div class="container">

    <div class="card">

        <div class="icon">🔤</div>

        <h1>Level 1 — ASCII</h1>

        <p>
            Welcome to your first Data Quest level!
        </p>

        <p>
            Learn how computers represent characters using
            <strong>ASCII</strong>.
        </p>

        <a href="{% url 'level1_game' %}" class="start-button">
            🚀 Start Level 1
        </a>


    </div>

</div>

</body>
</html>
