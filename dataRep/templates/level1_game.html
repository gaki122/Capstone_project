    ).textContent =
        `Question ${current + 1} of ${questions.length}`;


    document.getElementById(

    let tagText = "";


    if (q.type === "mcq") {

        tagText =

    }


    if (q.type === "fill") {

        tagText =
            "FILL IN THE BLANK";
    }

        tagText =
            "MATCHING GAME";
    }


    document.getElementById(
        "type-tag"
    ).textContent =
        tagText;


    let instructionText = "";


    if (q.type === "mcq") {

        instructionText =
            "Select one correct answer. Each question is worth one point.";
    }


    if (q.type === "fill") {

        instructionText =
            "Type your answer in the blank. Each question is worth one point.";
    }


    if (q.type === "matching") {

        instructionText =
            "Drag each answer from the answer bank into the correct row.";
    }


    document.getElementById(
        "instruction"
    ).textContent =
        instructionText;


    questionEl.textContent =
        q.question;


    answerArea.innerHTML = "";


    feedback.className =
        "feedback hidden";


    feedback.textContent =
        "";


    checkButton.classList.remove(
        "hidden"
    );


    checkButton.disabled =
        false;


    nextButton.classList.add(
        "hidden"
    );


    /* =========================
       MCQ
       ========================= */

        const options =
            document.createElement("div");

        options.className =
            "options";


        q.options.forEach(
            (option, index) => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "option";


                button.type =
                    "button";


                button.innerHTML =
                    `<span class="letter">
                        ${String.fromCharCode(65 + index)}
                    </span>`;


                button.appendChild(
                    document.createTextNode(
                        option
                    )
                );


                button.addEventListener(
                    "click",
                    () => {

                        if (answered) return;


                        options
                            .querySelectorAll(
                                ".option"
                            )
                            .forEach(button => {

                                button.style.outline =
                                    "none";
                            });


                        button.style.outline =
                            "3px solid #93c5fd";


                        button.dataset.selected =
                            "true";
                    }
                );


                options.appendChild(
                    button
                );

            }
        );


        answerArea.appendChild(
            options
        );
    }

       FILL IN THE BLANK
       ========================= */

        const input =
            document.createElement(
                "input"
            );

            "fill-input";


        input.type =
            "text";


        input.id =
            "fill-answer";


        input.placeholder =
            "Type your answer here...";


        input.autocomplete =
            "off";


        input.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter" &&
                    !answered
                ) {

                    checkAnswer();
                }

            }
        );


        answerArea.appendChild(
            input
        );


        input.focus();
    }


    /* =========================

    if (q.type === "matching") {

        const instruction =
            document.createElement(
                "div"
            );


        instruction.className =
            "matching-instruction";


        instruction.textContent =
            "🎯 Drag each answer code into the correct row.";


        answerArea.appendChild(
            instruction
        );


        const table =
            document.createElement(
                "table"
            );


        table.className =
            "matching-table";


        table.innerHTML = `

            <thead>

                <tr>

                    <th>
                        Character / Value
                    </th>

                    <th>
                        Matching Answer
                    </th>

            <tbody></tbody>

        `;


        const tbody =
            table.querySelector(

                        "td"
                    );

                    );

                    "dragover",
                    event => {

                        if (answered) return;


                        event.preventDefault();


                        dropZone.classList.add(
                            "drag-over"
                        );
                    }
                );


                dropZone.addEventListener(
                    "dragleave",
                    () => {

                        dropZone.classList.remove(
                            "drag-over"
                        );
                    }
                );


                dropZone.addEventListener(
                    "drop",
                    event => {

                        event.preventDefault();


                        if (answered) return;


                        dropZone.classList.remove(
                            "drag-over"
                        );


                        const value =
                            event.dataTransfer.getData(
                                "text/plain"
                            );


                        placeMatch(
                            dropZone,
                            value
                        );
                    }
                );


                dropCell.appendChild(
                    dropZone
                );


                row.appendChild(
                    characterCell
                );


                row.appendChild(
                    dropCell
                );


                tbody.appendChild(
                    row
                );

            }
        );


        answerArea.appendChild(
            table
        );


        /* ANSWER BANK */

        const bank =
            document.createElement(
                "div"
            );


        bank.className =
            "code-bank";


        const bankTitle =
            document.createElement(
                "div"
            );


        bankTitle.className =
            "code-bank-title";


        bankTitle.textContent =
            "🔀 Answer Bank";


        bank.appendChild(
            bankTitle
        );


        const codeOptions =
            document.createElement(
                "div"
            );


        codeOptions.className =
            "code-options";


        q.codes.forEach(
            code => {

                const option =
                    document.createElement(
                        "div"
                    );


                option.className =
                    "code-option";


                option.textContent =
                    code;


                option.draggable =
                    true;


                option.dataset.value =
                    code;


                option.addEventListener(
                    "dragstart",
                    event => {

                        if (answered) {

                            event.preventDefault();

                            return;
                        }


                        event.dataTransfer.setData(
                            "text/plain",
                            code
                        );
                    }
                );


                codeOptions.appendChild(
                    option
                );

            }
        );


        bank.appendChild(
            codeOptions
        );


        answerArea.appendChild(
            bank
        );
    }
}


/* =========================
   PLACE MATCH
   ========================= */

function placeMatch(
    dropZone,
    value
) {

    if (answered) return;


    const q =
        questions[current];


    const alreadyUsed =
        [
            ...answerArea.querySelectorAll(
                ".drop-cell .drop-zone"
            )
        ].some(
            zone =>
                zone !== dropZone &&
                zone.dataset.value === value
        );


    if (alreadyUsed) {

        alert(
            "That answer is already being used. Choose another answer."
        );


        return;
    }


    dropZone.textContent =
        `✓ ${value}`;


    dropZone.dataset.value =
        value;


    const options =
        answerArea.querySelectorAll(
            ".code-option"
        );


    options.forEach(
        option => {

            option.classList.remove(
                "selected"
            );
        }
    );
}


/* =========================
   CHECK ANSWER
   ========================= */

function checkAnswer() {

    if (answered) return;


    const q =
        questions[current];


    let correct =
        false;


    /* =========================
       MCQ CHECK
       ========================= */

    if (q.type === "mcq") {

        const selected =
            answerArea.querySelector(
                '[data-selected="true"]'
            );


        if (!selected) {

            alert(
                "Please select an answer first."
            );


            return;
        }


        const buttons =
            [
                ...answerArea.querySelectorAll(
                    ".option"
                )
            ];


        const selectedIndex =
            buttons.indexOf(
                selected
            );


        correct =
            selectedIndex === q.answer;


        buttons.forEach(
            (button, index) => {

                button.disabled =
                    true;


                if (
                    index === q.answer
                ) {

                    button.classList.add(
                        "correct"
                    );
                }


                if (
                    index === selectedIndex &&
                    !correct
                ) {

                    button.classList.add(
                        "wrong"
                    );
                }

            }
        );
    }


    /* =========================
       FILL CHECK
       ========================= */

    if (q.type === "fill") {

        const input =
            document.getElementById(
                "fill-answer"
            );


        if (!input.value.trim()) {

            alert(
                "Please type your answer first."
            );


            input.focus();


            return;
        }


        correct =
            q.answers.some(
                answer =>
                    normalize(answer) ===
                    normalize(input.value)
            );


        input.disabled =
            true;


        input.style.borderColor =
            correct
                ? "#16a34a"
                : "#dc2626";
    }


    /* =========================
       MATCHING CHECK
       ========================= */

    if (q.type === "matching") {

        const zones =
            [
                ...answerArea.querySelectorAll(
                    ".drop-zone"
                )
            ];


        const allFilled =
            zones.every(
                zone =>
                    zone.dataset.value
            );


        if (!allFilled) {

            alert(
                "Please complete all matching rows before checking."
            );


            return;
        }


        let correctMatches =
            0;


        zones.forEach(
            zone => {

                const expected =
                    zone.dataset.answer;


                const actual =
                    zone.dataset.value;


                if (
                    actual === expected
                ) {

                    correctMatches++;


                    zone.classList.add(
                        "correct-match"
                    );

                } else {

                    zone.classList.add(
                        "wrong-match"
                    );
                }

            }
        );


        correct =
            correctMatches ===
            zones.length;


        if (!correct) {

            feedback.className =
                "feedback bad";


            feedback.innerHTML =
                `<strong>
                    ❌ Some matches are incorrect.
                </strong>
                <br>
                Check the red rows. The correct answers are highlighted in green.`;
        }
    }


    /* =========================
       SCORE
       ========================= */

    answered =
        true;


    if (correct) {

        score++;
    }


    document.getElementById(
        "score"
    ).textContent =
        score;


    /* =========================
       FEEDBACK
       ========================= */

    if (
        q.type !== "matching" ||
        correct
    ) {

        feedback.className =
            `feedback ${
                correct
                    ? "good"
                    : "bad"
            }`;


        feedback.innerHTML =
            `<strong>

                ${
                    correct
                        ? "✅ Correct! +1 point"
                        : "❌ Not quite!"
                }

            </strong>

            <br>

            ${q.explanation}

            ${
                !correct
                    ? `<br>
                       <strong>
                       Correct answer:
                       </strong>

                       ${
                           q.type === "mcq"
                               ? q.options[q.answer]

                               : q.type === "fill"
                                   ? q.answers[0]

                                   : "See the green matching rows above."
                       }`

                    : ""
            }`;
    }


    if (
        q.type === "matching" &&
        !correct
    ) {

        feedback.className =
            "feedback bad";


        feedback.innerHTML +=

            `<br><br>

             <strong>
             Correct matches are shown in green.
             </strong>

             <br>

             ${q.explanation}`;
    }


    checkButton.classList.add(
        "hidden"
    );


    nextButton.classList.remove(
        "hidden"
    );


    nextButton.textContent =

        current === questions.length - 1

            ? "See My Results 🏆"

            : "Next Question →";


    document.getElementById(
        "progress-bar"
    ).style.width =

        `${((current + 1) / questions.length) * 100}%`;
}


/* =========================
   NEXT QUESTION
   ========================= */

function nextQuestion() {

    if (!answered) return;


    if (
        current ===
        questions.length - 1
    ) {

        showResults();


        return;
    }


    current++;


    renderQuestion();


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });
}


/* =========================
   RESULTS
   ========================= */

function showResults() {

    document.getElementById(
        "game"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "results"
    ).classList.remove(
        "hidden"
    );


    /* FINAL SCORE */

    document.getElementById(
        "final-score"
    ).textContent =
        `${score} / 20`;


    /* PERCENTAGE */

    const percentage =
        score * 5;


    /* RESULT EMOJI */

    document.getElementById(
        "result-emoji"
    ).textContent =

        score >= 18
            ? "🏆"
            : score >= 14
                ? "🌟"
                : score >= 10
                    ? "👏"
                    : "💪";


    /* RESULT TITLE */

    document.getElementById(
        "result-title"
    ).textContent =

        score >= 18
            ? "ASCII Champion!"
            : score >= 14
                ? "Great Work!"
                : score >= 10
                    ? "Good Progress!"
                    : "Keep Practising!";


    /* STAR RATING */

    let stars = 1;


    if (score >= 18) {

        stars = 5;

    } else if (score >= 14) {

        stars = 4;

    } else if (score >= 10) {

        stars = 3;

    } else if (score >= 5) {

        stars = 2;
    }


    document.getElementById(
        "result-stars"
    ).textContent =
        "⭐".repeat(stars);


    /* RESULT MESSAGE */

    document.getElementById(
        "result-message"
    ).textContent =
        `${percentage}% achieved`;


    /* RESULT DETAILS */

    document.getElementById(
        "result-details"
    ).textContent =

        `You answered ${score} out of 20 questions correctly. ` +

        (

            score >= 18

                ? "Excellent understanding of ASCII!"

                : score >= 14

                    ? "You are doing well. Review a few concepts and try again."

                    : score >= 10

                        ? "Good progress! Review the lesson and try again to improve."

                        : "Review the ASCII lesson and play again to improve your score."

        );


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });
}


/* =========================
   RESTART
   ========================= */

function restartGame() {

    current = 0;


    score = 0;


    answered = false;


    document.getElementById(
        "score"
    ).textContent =
        "0";


    document.getElementById(
        "results"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "game"
    ).classList.remove(
        "hidden"
    );


    renderQuestion();


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });
}


/* =========================
   BUTTON EVENTS
   ========================= */

checkButton.addEventListener(
    "click",
    checkAnswer
);


nextButton.addEventListener(
    "click",
    nextQuestion
);


document.getElementById(
    "restart-top"
).addEventListener(
    "click",
    restartGame
);


document.getElementById(
    "play-again"
).addEventListener(
    "click",
    restartGame
);


/* =========================
   START GAME
   ========================= */

renderQuestion();

</script>

</body>
</html>
