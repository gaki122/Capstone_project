<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teacher Login | Data Quest</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #eef4ff,
                #f8fbff
            );
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #333;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 22px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.10);

            text-align: center;
        }

        .logo {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            color: #2563eb;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-top: 8px;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 2px solid #dbe7ff;
            border-radius: 10px;

            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .login-button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #2563eb;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;

            padding: 12px;
            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;

            color: #2563eb;
            text-decoration: none;

            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            👨‍🏫
        </div>

        <h1>
            Teacher Login
        </h1>

        <p class="subtitle">
            Sign in to manage your classes and students
        </p>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button">

                🔐 Login as Teacher

            </button>

        </form>


        <a
            href="{% url 'home' %}"
            class="back-link">

            ← Back to Data Quest

        </a>

    </div>

</div>

</body>

</html>
